server {
    listen 80;
    server_name _;

    # Serve the frontend UI
    location / {
        root /var/www/html;
        index index.html;
    }

    # Reverse proxy for Logs Service
    location /logs/ {
        proxy_pass http://127.0.0.1:3001/;
    }

    # Reverse proxy for Users Service
    location /users/ {
        proxy_pass http://127.0.0.1:3002/;
    }

    # Reverse proxy for Costs Service
    location /costs/ {
        proxy_pass http://127.0.0.1:3003/;
    }

    # Reverse proxy for About Service
    location /about/ {
        proxy_pass http://127.0.0.1:3004/;
    }
}
