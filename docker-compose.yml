services:
  mongodb:
    image: mongo:4.4
    container_name: cost-manager-db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  seed-service:
    build: .
    container_name: seed-service
    command: node seed.js
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/cost-manager
    depends_on:
      mongodb:
        condition: service_healthy

  logs-service:
    build: .
    container_name: logs-service
    command: node logs-service.js
    ports:
      - "3001:3001"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/cost-manager
    depends_on:
      seed-service:
        condition: service_completed_successfully

  users-service:
    build: .
    container_name: users-service
    command: node users-service.js
    ports:
      - "3002:3002"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/cost-manager
    depends_on:
      seed-service:
        condition: service_completed_successfully

  costs-service:
    build: .
    container_name: costs-service
    command: node costs-service.js
    ports:
      - "3003:3003"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/cost-manager
    depends_on:
      seed-service:
        condition: service_completed_successfully

  about-service:
    build: .
    container_name: about-service
    command: node about-service.js
    ports:
      - "3004:3004"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/cost-manager
    depends_on:
      seed-service:
        condition: service_completed_successfully

  ui:
    build: ./ui
    container_name: cost-manager-ui
    ports:
      - "8080:80"
    depends_on:
      seed-service:
        condition: service_completed_successfully
