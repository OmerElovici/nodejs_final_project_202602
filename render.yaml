services:
  # 1. Ephemeral MongoDB (Web Service with a runtime netcat HTTP health check sidecar)
  - type: web
    name: mongodb
    runtime: image
    image:
      url: "mongo:4.4"
    plan: free
    dockerCommand: "apt-get update && apt-get install -y netcat && (while true; do echo -e 'HTTP/1.1 200 OK\\r\\nContent-Length: 2\\r\\n\\r\\nOK' | nc -l -p 10000; done) & mongod --bind_ip_all"

  # 2. Users Microservice (Seeds the DB automatically on start!)
  - type: web
    name: users-service
    runtime: docker
    dockerCommand: "node seed.js && node users_service.js"
    plan: free
    envVars:
      - key: MONGODB_HOST
        fromService:
          type: web
          name: mongodb
          property: host
      - key: MONGODB_PORT
        value: "27017"

  # 3. Logs Microservice
  - type: web
    name: logs-service
    runtime: docker
    dockerCommand: "node logs_service.js"
    plan: free
    envVars:
      - key: MONGODB_HOST
        fromService:
          type: web
          name: mongodb
          property: host
      - key: MONGODB_PORT
        value: "27017"

  # 4. Costs Microservice
  - type: web
    name: costs-service
    runtime: docker
    dockerCommand: "node costs_service.js"
    plan: free
    envVars:
      - key: MONGODB_HOST
        fromService:
          type: web
          name: mongodb
          property: host
      - key: MONGODB_PORT
        value: "27017"

  # 5. About Microservice
  - type: web
    name: about-service
    runtime: docker
    dockerCommand: "node about_service.js"
    plan: free
    envVars:
      - key: MONGODB_HOST
        fromService:
          type: web
          name: mongodb
          property: host
      - key: MONGODB_PORT
        value: "27017"

  # 6. Nginx-based Frontend UI
  - type: web
    name: cost-manager-ui
    runtime: docker
    dockerContext: ./ui
    dockerfilePath: ./ui/Dockerfile
    plan: free
