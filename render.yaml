services:
  # 1. Ephemeral MongoDB (Private Service - secure and bypasses HTTP health checks)
  - type: pserv
    name: mongodb
    runtime: image
    image:
      url: "mongo:4.4"
    plan: free

  # 2. Users Microservice (Seeds the DB automatically on start!)
  - type: web
    name: users-service
    runtime: docker
    dockerCommand: "node seed.js && node users_service.js"
    plan: free
    envVars:
      - key: MONGODB_HOST
        fromService:
          type: pserv
          name: mongodb
          property: host
      - key: MONGODB_PORT
        fromService:
          type: pserv
          name: mongodb
          property: port

  # 3. Logs Microservice
  - type: web
    name: logs-service
    runtime: docker
    dockerCommand: "node logs_service.js"
    plan: free
    envVars:
      - key: MONGODB_HOST
        fromService:
          type: pserv
          name: mongodb
          property: host
      - key: MONGODB_PORT
        fromService:
          type: pserv
          name: mongodb
          property: port

  # 4. Costs Microservice
  - type: web
    name: costs-service
    runtime: docker
    dockerCommand: "node costs_service.js"
    plan: free
    envVars:
      - key: MONGODB_HOST
        fromService:
          type: pserv
          name: mongodb
          property: host
      - key: MONGODB_PORT
        fromService:
          type: pserv
          name: mongodb
          property: port

  # 5. About Microservice
  - type: web
    name: about-service
    runtime: docker
    dockerCommand: "node about_service.js"
    plan: free
    envVars:
      - key: MONGODB_HOST
        fromService:
          type: pserv
          name: mongodb
          property: host
      - key: MONGODB_PORT
        fromService:
          type: pserv
          name: mongodb
          property: port

  # 6. Nginx-based Frontend UI
  - type: web
    name: cost-manager-ui
    runtime: docker
    dockerContext: ./ui
    dockerfilePath: ./ui/Dockerfile
    plan: free
